apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-service-account
  namespace: smart-devices

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: smart-devices
  name: admin-role
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-role-binding
  namespace: smart-devices
subjects:
  - kind: ServiceAccount
    name: admin-service-account
    namespace: smart-devices
roleRef:
  kind: Role
  name: admin-role
  apiGroup: rbac.authorization.k8s.io
